experiment:
  name: nlimoe_paper_v3_dynamic
  description: "Section 5 / 6.2 of arXiv:2406.17716v3; unresolved details documented in paper_extraction.md"

data:
  dataset_name: "uitnlp/ViANLI"
  max_length: 256
  premise_col: "premise"
  hypothesis_col: "hypothesis"
  label_col: "label"

model:
  architecture: "paper_nlimoe_v3"
  backbone: "xlm-roberta-large" # Inferred from explicitly reported d=1024.
  expected_hidden_size: 1024
  num_labels: 3
  pooling: "mean"
  dropout: 0.4
  encoder_dropout: 0.4 # Scope of reported dropout is an implementation assumption.

moe:
  num_experts: 7
  expert_hidden_dim: 1024
  router_type: "linear"
  routing_type: "dynamic"
  top_k: 4 # Inactive for dynamic; use nlimoe_topk.yaml for published Top-K.
  threshold: 0.1
  gamma: 0.1
  dynamic_loss_weight: 0.001
  balance_loss_weight: 0.01
  threshold_gradient: "hard" # Literal Eq. (6); no complexity-head gradient.
  empty_selection_policy: "zero" # Not reported; numerical convention.

training:
  seed: 42
  lr_backbone: 1.0e-5
  lr_moe: 1.0e-5
  weight_decay: 0.0
  adam_epsilon: 1.0e-8
  batch_size: 16
  epochs: 7
  eval_frequency: 400
  scheduler: "constant" # NOT_REPORTED: do not add an unreported decay schedule.
  warmup_ratio: 0.0
  gradient_accumulation_steps: 1
  max_grad_norm: null # NOT_REPORTED
  early_stopping_patience: 0 # NOT_REPORTED; run the reported 7 epochs.

provenance:
  source: "https://arxiv.org/html/2406.17716v3"
  architecture: "Section 5, equations 2-16"
  training: "Section 6.2"
  unresolved: ["exact checkpoint identifier", "hard-mask gradient estimator", "empty selection", "optimizer class", "scheduler", "seed", "dense baseline head"]

evaluation:
  primary_metric: "accuracy"
  secondary_metric: "macro_f1"
  save_best_checkpoint: true
