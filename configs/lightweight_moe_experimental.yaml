# Prototype; not a faithful reproduction of the paper.
experiment:
  name: lightweight_moe_experimental
  description: "Smaller MLP experts, straight-through threshold gradients, sparse inference"
data:
  dataset_name: "uitnlp/ViANLI"
  max_length: 128
model:
  backbone: "xlm-roberta-base"
  num_labels: 3
  pooling: "mean"
  dropout: 0.1
moe:
  num_experts: 4
  intermediate_dim: 256
  router_type: "linear"
  routing_type: "dynamic"
  top_k: 2
  threshold: 0.25
  dynamic_scale: 0.5
  threshold_gradient: "straight_through"
  threshold_temperature: 0.1
  sparse_inference: true
  aux_loss_weight: 0.01
training:
  seed: 42
  lr_backbone: 2.0e-5
  lr_moe: 1.0e-4
  weight_decay: 0.01
  batch_size: 16
  epochs: 5
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  early_stopping_patience: 3
