# Optional XLM-R Large baseline; same published training settings as Base.
experiment:
  name: xlmr_large_paper_v3
  description: XLM-R Base with training hyperparameters from Section 6.2; head details
    not reported
data:
  dataset_name: uitnlp/ViANLI
  max_length: 256
  premise_col: premise
  hypothesis_col: hypothesis
  label_col: label
model:
  backbone: xlm-roberta-large
  num_labels: 3
  pooling: cls
  dropout: 0.4
  encoder_dropout: 0.4
training:
  seed: 42
  lr: 1.0e-05
  weight_decay: 0.0
  adam_epsilon: 1.0e-08
  batch_size: 16
  epochs: 7
  eval_frequency: 400
  scheduler: constant
  warmup_ratio: 0.0
  gradient_accumulation_steps: 1
  max_grad_norm: null
  early_stopping_patience: 0
provenance:
  source: https://arxiv.org/html/2406.17716v3
  reported: 'Section 6.2: max_length, lr, eval_frequency, batch_size, weight_decay,
    epsilon, dropout, epochs'
  assumptions:
  - CLS plus linear classification head
  - AdamW
  - encoder dropout scope
  - constant learning rate
  - best validation accuracy checkpoint
  - seed 42
evaluation:
  primary_metric: accuracy
  secondary_metric: macro_f1
  save_best_checkpoint: true
