[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vianli-nlimoe"
version = "0.1.0"
description = "Reproduction of NLIMoE baseline on uitnlp/ViANLI for Lightweight MoE research"
authors = [
    { name = "Research Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "accelerate>=0.26.0",
    "tqdm>=4.66.0"
]
